---
# yaml-language-server: $schema=https://blue-build.org
name: surface-silverblue44
description: Fedora Silverblue 44 mit Linux Surface Kernel

base-image: ghcr.io/ublue-os/silverblue-main
image-version: latest

modules:
      # 1. Schritt: Repository-Datei via Skript herunterladen
      - type: script
        snippets:
          - "curl -sLo /etc/yum.repos.d/linux-surface.repo https://surfacelinux.com"

      # 2. Schritt: Pakete installieren (Der "init"-Block wurde hier entfernt)
      - type: rpm-ostree
        repos:
          - copr:atim/starship
        install:
          - micro
          - starship
          - kernel-surface
          - surface-secureboot-mok
          - iptsd
          - surface-control
        remove:
          - firefox
          - firefox-langpacks
