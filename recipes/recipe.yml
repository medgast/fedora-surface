# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

version: 1

name: fedora-silverblue-surface

description: Ein angepasstes Fedora-Silverblue-Image für Microsoft-Surface-Geräte mit linux-surface-Kernel.

base-image: quay.io/fedora/fedora-silverblue
image-version: 45

modules:
  - type: dnf
    repos:
      files:
        - linux-surface.repo
    replace:
      - from-repo: linux-surface
        allow-erasing: true
        packages:
          - old: libwacom
            new: libwacom-surface
          - old: libwacom-date
            new: libwacom-surface-data
