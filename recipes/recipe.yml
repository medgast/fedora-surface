# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
version: 1
name: fedora-silverblue-surface
description: Ein angepasstes Fedora Silverblue Image fuer Microsoft Surface Geraete mit integriertem linux-surface Kernel.

base-image: ghcr.io/blue-build/base-images/fedora-silverblue
image-version: latest

modules:
  # 1. Kernel auf linux-surface umstellen
  - type: akmods
    base: surface

  # 2. Zusaetzliche Surface-Tools ueber das dnf-Modul installieren
  - type: dnf
    repos:
      files:
        - https://pkg.surfacelinux.com/fedora/linux-surface.repo
    install:
      packages:
        - iptsd                   # Wichtig fuer Touchscreen-Unterstuetzung
        - libwacom-surface        # Angepasste Tablet-Konfigurationen
        - surface-secureboot      # Importiert MOK-Keys fuer Secure Boot beim ersten Start

  # 3. Den iptsd Touchscreen-Daemon beim Systemstart aktivieren
  - type: systemd
    system:
      enabled:
        - iptsd.service
