# https://blue-build.org/reference/recipe/
version: 1
name: fedora-silverblue-surface
description: Ein angepasstes Fedora Silverblue Image für Microsoft Surface Geräte mit integriertem linux-surface Kernel.

base-image: ghcr.io/fedora-atomic/silverblue
image-version: 40 # Oder '41' / 'latest', je nachdem welche Fedora-Version gewünscht ist

transient:
  - /tmp

modules:
  # 1. Das linux-surface DNF Repository hinzufügen
  - type: repo
    repositories:
      - fedora-surface: https://pkg.surfacelinux.com/fedora/linux-surface.repo

  # 2. Den Standard-Kernel durch den linux-surface Kernel ersetzen
  # Sowie notwendige Treiber und Daemons für Touch/Stift installieren
  - type: rpm-ostree
    repositories:
      - fedora-surface
    remove:
      - kernel
      - kernel-core
      - kernel-modules
      - kernel-modules-extra
    install:
      - kernel-surface
      - kernel-surface-devel
      - iptsd                   # Wichtig für Touchscreen-Unterstützung
      - libwacom-surface        # Angepasste Tablet-Konfigurationen
      - surface-secureboot      # Optional, falls Secure Boot aktiv bleiben soll

  # 3. Den iptsd Touchscreen-Daemon beim Systemstart aktivieren
  - type: systemd
    system:
      enabled:
        - iptsd.service
