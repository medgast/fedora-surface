# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

version: 1

name: fedora-silverblue-surface

description: Ein angepasstes Fedora-Silverblue-Image für Microsoft-Surface-Geräte mit linux-surface-Kernel.

base-image: ghcr.io/ublue-os/silverblue
image-version: 44

modules:
  - type: dnf
    repos:
      files:
        - linux-surface.repo
    install:
      packages:
        - kernel-surface
        - iptsd
    remove:
      packages:
        - firefox
