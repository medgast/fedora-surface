---
# yaml-language-server: $schema=https://blue-build.org
name: surface-silverblue44
description: Fedora Silverblue 44 mit Linux Surface Kernel

base-image: ghcr.io/ublue-os/silverblue-main
image-version: latest

modules:
  # 1. Schritt: Pakete installieren, entfernen und das KORREKTE Linux-Surface Repo einbinden
  - type: rpm-ostree
    repos:
      - copr:atim/starship
      # WICHTIG: Hier muss die direkte URL zur .repo-Datei eingetragen sein!
      - https://surfacelinux.com
    install:
      - micro
      - starship
      - surface-secureboot-mok
      - iptsd
      - surface-control
    remove:
      - firefox
      - firefox-langpacks

  # 2. Schritt: Den Fedora-Standardkernel durch den Surface-Kernel ersetzen
  # Dies verhindert Paketkonflikte während des GitHub-Builds.
  - type: script
    snippets:
      - "rpm-ostree override replace --experimental --from repo=linux-surface kernel kernel-core kernel-modules kernel-modules-extra"

  # 3. Schritt: Das Initramfs für den neuen Kernel generieren
  # Zwingend erforderlich, damit Touchscreen- und Tastaturtreiber beim Booten geladen werden.
  - type: initramfs
