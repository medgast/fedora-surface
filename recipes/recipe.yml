# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

version: 1

name: fedora-silverblue-surface

description: Ein angepasstes Fedora-Silverblue-Image für Microsoft-Surface-Geräte mit linux-surface-Kernel.

base-image: ghcr.io/ublue-os/silverblue
image-version: 44

modules:
  - type: dnf
    repos:
      - |
        [linux-surface]
        name=linux-surface
        baseurl=https://pkg.surfacelinux.com/fedora/f43/
        enabled=1
        skip_if_unavailable=1
        gpgkey=https://raw.githubusercontent.com/linux-surface/linux-surface/master/pkg/keys/surface.asc
        gpgcheck=1
        enabled_metadata=1
        type=rpm-md
        repo_gpgcheck=0
    install:
      packages:
        - kernel-surface
        - iptsd
    remove:
      packages:
        - firefox
        - firefox-langpacks
