# yaml-language-server: $schema=https://blue-build.org
name: surface-silverblue44
description: Fedora Silverblue 44 mit Linux Surface Kernel

base-image: ghcr.io/ublue-os/silverblue-main
image-version: latest

modules:
  # Das rpm-ostree Modul übernimmt nun das Einbinden UND Installieren
  - type: rpm-ostree
    repos:
      - copr:atim/starship
    # Hier laden wir die Repo-Datei sicher während des Build-Vorgangs herunter:
    init:
      - curl -sLo /etc/yum.repos.d/linux-surface.repo https://surfacelinux.com
    install:
      - micro
      - starship
      - kernel-surface
      - surface-secureboot-mok
      - iptsd
      - libwacom-surface
      - surface-control
    remove:
      - firefox
      - firefox-langpacks

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
      - scope: user

  - type: signing
